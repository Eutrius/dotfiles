# vim: ft=tmux

# Action key
unbind C-b
set-option -g prefix M-r
set-option -g repeat-time 0
set-option -g focus-events on
set -g base-index 1

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open current directory
bind o run-shell "open #{pane_current_path}"

# Rebind new-window to inherit the current directory
bind c new-window -c "#{pane_current_path}"

# New session
bind-key -n C-M-n new-session

# Vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Navigate windows
bind -n M-q previous-window
bind -n M-e next-window

# Kill window
bind -n M-w confirm-before -p "close this window? y/n" "kill-window"

# Moving window
bind-key C-Left swap-window -t -1 \; previous-window
bind-key C-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# Split pane
bind -r v splitw -h  -c "#{pane_current_path}"
bind -r V splitw -v  -c "#{pane_current_path}"

# Killoall panes
bind -r e confirm-before -p "kill all pane?" "kill-pane -a"

# Open fzf sessions
bind -r \\ run-shell 'tmux ls | cut -d: -f1 | fzf --tmux bottom,100%,30% --border=none | xargs tmux switch-client -t || true'

# Open lazygit
bind -r g popup -E -w 90% -h 90% -B -d "#{pane_current_path}" "lazygit"
bind -r d popup -E -w 90% -h 90% -B -d "#{pane_current_path}" "lazydocker"
