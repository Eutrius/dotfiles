# --- General ---
general {
    lock_cmd = pidof hyprlock || hyprlock       # Run hyprlock only if not already running
    before_sleep_cmd = loginctl lock-session    # Lock before the system sleeps
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn the screen back on after waking
    ignore_dbus_inhibit = false
}

# --- Listeners ---
# Turn the screen off while hyprlock is active (30s idle)
listener {
    timeout = 30
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = pidof hyprlock && hyprctl dispatch dpms on
}

# Lock the session after 30 minutes idle
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# Turn the screen off 30s after locking
listener {
    timeout = 1830
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
