# --- Hyprland ---
# Main entry point. Modular configs live in ./configs and are sourced below.

$configs = $HOME/.config/hypr/configs

source = $configs/env.conf
source = $configs/monitors.conf
source = $configs/settings.conf
source = $configs/decorations.conf
source = $configs/window-rules.conf
source = $configs/keybinds.conf
source = $configs/startup-apps.conf
