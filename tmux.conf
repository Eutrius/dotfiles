# Settings
set-option -g status-justify "left"
set -g mouse on
set-window-option -g mode-keys vi
set-option -g history-limit 64096
set -sg escape-time 10
set -g renumber-windows on

# Colors
run-shell ~/.config/tmux/set_terminal.sh
set -g set-titles on
set -g set-titles-string "#T"

# Status bar
set-option -g status-style fg=default,bg=default

# Mode style
set-option -g mode-style fg=colour33,bg=default

# Current window title
set-window-option -g window-status-current-style fg=colour33,bg=default

# Pane borders
set-option -g pane-border-style fg=default,bg=default
set-option -g pane-active-border-style fg=default

# Messages
set-option -g message-style fg=default,bg=default
set-option -g message-command-style fg=default,bg=default

# Display pane number
set-option -g display-panes-active-colour colour33

set -g base-index 1
set -g status-left-length 30
set -g status-right "%H:%M %d-%b-%y"

source ~/.config/tmux/keymaps.conf
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
set -g @resurrect-dir '~/.tmux/resurrect'
