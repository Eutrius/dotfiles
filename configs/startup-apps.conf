# --- Variables ---
$scriptsDir = $HOME/.config/hypr/scripts
$wallpaper = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
$hyprspace = $HOME/.config/hypr/Hyprspace/Hyprspace.so

# --- Wallpaper ---
exec-once = awww-daemon --format argb
exec-once = sleep 1 && awww img $wallpaper

# --- Environment ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- Polkit (Gnome / KDE authentication agent) ---
exec-once = $scriptsDir/polkit.sh

# --- Core Apps ---
exec-once = waybar &
exec-once = nm-applet --indicator &
exec-once = swaync &

# --- Clipboard Manager ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Idle & Lock ---
exec-once = hypridle &

# --- Cursor ---
exec-once = hyprctl setcursor Bibata-Modern-Ice 20

# --- Session Apps ---
# Kitty + tmux on workspace 1, fullscreen (rule pairs with the exec below)
windowrule = match:class ^(kitty)$, match:title (startup), fullscreen 1
exec-once = [workspace 1 silent] kitty --title startup -e $scriptsDir/tmux.sh
exec-once = [workspace 2 silent] firefox --fullscreen
