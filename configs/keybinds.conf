# --- Variables ---
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts

# --- Applications & Launchers ---
bind = $mainMod, Return, exec, kitty                                    # Terminal
bind = $mainMod, T, exec, thunar                                        # File manager
bind = $mainMod, O, exec, pkill rofi || rofi -show drun -modi drun      # App launcher
bind = $mainMod, V, exec, $scriptsDir/clip-manager.sh                   # Clipboard manager
bind = $mainMod, X, exec, $scriptsDir/wallpaper-select.sh               # Wallpaper picker
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar                         # Toggle waybar
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw                    # Toggle notification panel
bind = $mainMod, R, exec, $scriptsDir/refresh.sh                        # Refresh waybar, swaync, rofi

# --- Window Management ---
bind = $mainMod, W, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo                                              # Toggle pseudotile
bind = $mainMod SHIFT, F, exec, $scriptsDir/floating.sh                 # Toggle floating (resize + center)
bind = $mainMod CTRL, F, exec, hyprctl dispatch workspaceopt allfloat   # Toggle all-float
bind = $mainMod, M, exec, $scriptsDir/change-layout.sh                  # Toggle master/dwindle layout

# --- Focus ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = ALT, tab, cyclenext                                             # Cycle through windows
bind = ALT, tab, bringactivetotop                                     # Bring floating window to top

# --- Move Windows ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# --- Resize Windows ---
binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, E, workspace, +1
bind = $mainMod, Q, workspace, -1
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1
bind = $mainMod, mouse_down, workspace, e+1                            # Scroll to next workspace
bind = $mainMod, mouse_up, workspace, e-1                              # Scroll to previous workspace

# --- Special Workspace ---
bind = $mainMod, code:51, togglespecialworkspace
bind = $mainMod SHIFT, code:51, movetoworkspace, special

# --- Move Window to Workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, bracketleft, movetoworkspace, -1               # Previous workspace
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1              # Next workspace

# --- Move Window to Workspace (silent) ---
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1          # Previous workspace
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1         # Next workspace

# --- Media & Brightness Keys ---
binde = , xf86MonBrightnessUp, exec, $scriptsDir/brightness.sh --inc
binde = , xf86MonBrightnessDown, exec, $scriptsDir/brightness.sh --dec
bindel = , xf86audioraisevolume, exec, $scriptsDir/volume.sh --inc
bindel = , xf86audiolowervolume, exec, $scriptsDir/volume.sh --dec
bindl = , xf86audiomute, exec, $scriptsDir/volume.sh --toggle
bindl = , xf86AudioMicMute, exec, $scriptsDir/volume.sh --toggle-mic

# --- Screenshots ---
bind = $mainMod, S, exec, $scriptsDir/screenshot.sh --swappy            # Select area + edit
bind = $mainMod, Print, exec, $scriptsDir/screenshot.sh --now
bind = $mainMod SHIFT, Print, exec, $scriptsDir/screenshot.sh --area
bind = ALT, Print, exec, $scriptsDir/screenshot.sh --active            # Active window
bind = $mainMod CTRL, Print, exec, $scriptsDir/screenshot.sh --in5      # After 5 seconds
bind = $mainMod CTRL SHIFT, Print, exec, $scriptsDir/screenshot.sh --in10  # After 10 seconds

# --- Session & Hardware ---
bind = , code:157, exec, $scriptsDir/wlogout.sh                        # Power menu
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0                 # Exit Hyprland
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-2, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl reload

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow                                # Drag to move
bindm = $mainMod, mouse:273, resizewindow                              # Drag to resize
